name: Build macOS (C++)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          cache: true

      - name: Build and test native release
        shell: bash
        run: ./scripts/build_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloaderPro-macOS
          path: dist/VideoDownloaderPro-macOS.zip
          if-no-files-found: error
