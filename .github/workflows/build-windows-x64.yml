name: Build Windows x64 (C++)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: win64_mingw
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and test native release
        shell: pwsh
        run: ./scripts/build_release_windows.ps1 -QtDir "$env:QT_ROOT_DIR\lib\cmake\Qt6"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloaderPro-win-x64
          path: |
            dist/VideoDownloaderPro-win-x64.zip
            dist/VideoDownloaderPro-Setup-4.0.1.exe
          if-no-files-found: error
