name: Build Windows x64 (C++)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Build and test native release
        shell: pwsh
        run: ./scripts/build_release_windows.ps1 -QtDir "$env:QT_ROOT_DIR\lib\cmake\Qt6"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloaderPro-win-x64
          path: dist/VideoDownloaderPro-win-x64.zip
          if-no-files-found: error
